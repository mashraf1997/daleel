# One-click deploy on a Hostinger VPS (Docker Manager), or anywhere with Docker:
#   docker compose up -d
# Then open http://YOUR-SERVER-IP and create your password.
services:
  daleel:
    image: ghcr.io/mashraf1997/daleel:latest
    container_name: daleel
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - SETUP_TOKEN=${SETUP_TOKEN:-}
    volumes:
      - daleel-data:/data

volumes:
  daleel-data:
